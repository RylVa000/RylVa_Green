<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halaman Error Publik — pemeriksaan tampilan</title>
    <link rel="stylesheet" href="/assets/css/shared/tokens.css">
    <style>
      body
      {
        margin: 24px;
        background: var(--background);
        color: var(--primary-dark);
        font-family: var(--font-body);
      }

      h1
      {
        font-size: 24px;
      }

      .preview-controls
      {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        margin-block: 24px;
      }

      label
      {
        display: grid;
        gap: 8px;
      }

      select,
      a
      {
        min-height: 44px;
        color: var(--primary-dark);
        font: inherit;
      }

      select
      {
        padding: 8px;
        border: 1px solid var(--primary);
        border-radius: 8px;
        background: var(--card-background);
      }

      :focus-visible
      {
        outline: 3px solid var(--primary);
        outline-offset: 4px;
      }

      .preview-viewport
      {
        overflow: auto;
      }

      iframe
      {
        display: block;
        width: 1440px;
        height: 1000px;
        border: 1px solid var(--neutral-soft);
        background: var(--background);
      }
    </style>
  </head>
  <body>
    <h1>Halaman Error Publik — pemeriksaan tampilan</h1>
    <p>
      Kontrol pengembangan hanya mengubah tampilan frame di bawah. Tidak mengaktifkan maintenance global;
      tidak ada perubahan akun atau transaksi yang disimulasikan.
    </p>
    <div class="preview-controls">
      <label for="preview-page">
        Halaman
        <select id="preview-page">
          <option value="404">404 — Tidak ditemukan</option>
          <option value="403">403 — Akses ditolak</option>
          <option value="500">500 — Gangguan sistem</option>
          <option value="503">503 — Maintenance</option>
        </select>
      </label>
      <label for="preview-state">
        Kondisi
        <select id="preview-state">
          <option value="ready">Normal</option>
          <option value="offline">Offline</option>
          <option value="broken-image">Ilustrasi gagal dimuat</option>
          <option value="long-text">Teks panjang</option>
          <option value="catalogue-return">Kembali ke Katalog berfilter</option>
          <option value="unsafe-return">Tujuan kembali tidak diizinkan</option>
          <option value="no-script">JavaScript dinonaktifkan</option>
        </select>
      </label>
      <label for="preview-width">
        Lebar layar
        <select id="preview-width">
          <option value="1440">Desktop 1440 px</option>
          <option value="1024">Tablet 1024 px</option>
          <option value="768">Tablet 768 px</option>
          <option value="390">Mobile 390 px</option>
          <option value="320">Mobile 320 px</option>
        </select>
      </label>
    </div>
    <p><a href="/pages/public/error-404.html">Buka halaman 404</a></p>
    <div class="preview-viewport">
      <iframe id="preview-frame" title="Pratinjau Halaman Error Publik"></iframe>
    </div>
    <script>
      "use strict";

      (() =>
      {
        const frame = document.getElementById("preview-frame");
        const state = document.getElementById("preview-state");
        const page = document.getElementById("preview-page");
        const routes = { "404": "error-404.html", "403": "error-403.html", "500": "error-500.html", "503": "maintenance.html" };
        const width = document.getElementById("preview-width");

        function refresh()
        {
          if (state.value === "no-script")
          {
            frame.setAttribute("sandbox", "allow-same-origin");
          }
          else
          {
            frame.removeAttribute("sandbox");
          }
          frame.style.width = width.value + "px";
          const target = new URL("/pages/public/" + routes[page.value], location.origin);
          if (state.value === "catalogue-return")
          {
            target.searchParams.set("returnTo", "/pages/public/catalog.html?q=monstera&category=plants&sort=price_asc");
          }
          if (state.value === "unsafe-return")
          {
            target.searchParams.set("returnTo", "https://outside.example/");
          }
          frame.src = target.pathname + target.search;
        }

        frame.addEventListener("load", () =>
        {
          const preview = frame.contentDocument;
          const previewWindow = preview.defaultView;
          if (state.value === "offline")
          {
            Object.defineProperty(previewWindow.navigator, "onLine", { configurable: true, get: () => false });
            previewWindow.dispatchEvent(new previewWindow.Event("offline"));
          }
          if (state.value === "broken-image")
          {
            preview.getElementById("public-error-illustration").src = "/assets/images/public-errors/development-missing.jpg";
          }
          if (state.value === "long-text")
          {
            preview.querySelector("h1").textContent = "Halaman yang ingin Anda buka belum dapat ditampilkan untuk saat ini";
            preview.querySelector(".public-error-description").textContent =
              "Anda tetap dapat memilih halaman lain atau menghubungi bantuan untuk memeriksa kendala dan melanjutkan penelusuran produk yang sesuai kebutuhan Anda.";
          }
        });
        page.addEventListener("change", refresh);
        state.addEventListener("change", refresh);
        width.addEventListener("change", refresh);
        refresh();
      })();
    </script>
  </body>
</html>

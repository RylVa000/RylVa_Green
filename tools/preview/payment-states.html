<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Workbench Pembayaran | RylVa Green</title>
  <link rel="stylesheet" href="/assets/css/storefront/payment.css">
  <style>
    .workbench
    {
      padding: 16px;
      background: var(--card-background);
      border-bottom: 1px solid var(--primary-light);
    }

    .workbench-controls
    {
      display: flex;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
    }

    .workbench label
    {
      display: grid;
      gap: 4px;
      font-size: 13px;
    }

    .workbench select,
    .workbench a
    {
      min-height: 44px;
      padding: 8px;
    }

    .workbench-frame
    {
      display: block;
      width: 100%;
      height: calc(100dvh - 175px);
      min-height: 600px;
      border: 0;
    }
  </style>
</head>
<body class="payment-page">
  <header class="workbench">
    <h1>Workbench Pembayaran</h1>
    <p>Kontrol pengembangan. Semua data dan perubahan hanya contoh lokal.</p>
    <div class="workbench-controls">
      <label for="scenario">
        State halaman
        <select id="scenario"></select>
      </label>
      <label for="action-error">
        Gangguan tindakan berikutnya
        <select id="action-error">
          <option value="">Tidak ada</option>
          <option value="timeout">Timeout, hasil belum pasti</option>
          <option value="gateway">Gangguan gateway</option>
          <option value="conflict">409, dibayar dari tab lain</option>
          <option value="rate-limit">429, pembatasan sementara</option>
          <option value="csrf">CSRF tidak valid</option>
          <option value="validation">Validasi metode</option>
        </select>
      </label>
      <button type="button" id="reset-fixture" class="button button-secondary">Reset Data Contoh</button>
      <a id="open-preview" class="text-button" target="_blank" rel="noopener">Buka Halaman</a>
    </div>
  </header>
  <iframe class="workbench-frame" id="preview" title="Pratinjau halaman pembayaran"></iframe>
  <script src="/assets/js/storefront/payment-preview-data.js"></script>
  <script>
    "use strict";

    const scenarioSelect = document.getElementById("scenario");
    const actionErrorSelect = document.getElementById("action-error");
    const query = new URLSearchParams(window.location.search);

    for (const [scenarioId, scenarioLabel] of Object.entries(window.RylvaPaymentPreview.scenarioLabels))
    {
      const option = document.createElement("option");
      option.value = scenarioId;
      option.textContent = scenarioLabel;
      scenarioSelect.append(option);
    }

    scenarioSelect.value = Object.hasOwn(window.RylvaPaymentPreview.scenarioLabels, query.get("state"))
      ? query.get("state") : "pending";
    actionErrorSelect.value = query.get("actionError") || "";

    function updatePreview()
    {
      const parameters = new URLSearchParams({ state: scenarioSelect.value });
      if (actionErrorSelect.value)
      {
        parameters.set("actionError", actionErrorSelect.value);
      }
      const previewUrl = "/pages/customer/payment.html?" + parameters;
      document.getElementById("preview").src = previewUrl;
      document.getElementById("open-preview").href = previewUrl;
      window.history.replaceState(null, "", window.location.pathname + "?" + parameters);
    }

    scenarioSelect.addEventListener("change", updatePreview);
    actionErrorSelect.addEventListener("change", updatePreview);
    document.getElementById("reset-fixture").addEventListener("click", () =>
    {
      window.sessionStorage.removeItem("rylva-payment-preview-v1:" + scenarioSelect.value);
      updatePreview();
    });
    updatePreview();
  </script>
</body>
</html>

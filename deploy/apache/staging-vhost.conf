# Linux staging template. Replace the deployment paths/hostname before enabling.
# Required modules: proxy, proxy_fcgi, rewrite, headers, auth_basic, authn_file, authz_user.
# Expose only through an HTTPS reverse proxy; this listener remains loopback-only.
Define RYLVA_PROJECT_ROOT /srv/rylva-green/current
Define RYLVA_STAGING_AUTH_FILE /etc/rylva-green/staging.htpasswd
Define RYLVA_STAGING_ENV_FILE /etc/rylva-green/staging.env
Define RYLVA_FPM_SOCKET /run/php/php8.3-fpm.sock

<VirtualHost 127.0.0.1:8080>
  ServerName staging.example.invalid
  DocumentRoot "${RYLVA_PROJECT_ROOT}/public"
  DirectoryIndex index.php
  ServerSignature Off
  SetEnv APP_ENV staging
  SetEnv APP_DEBUG false
  SetEnv RYLVA_ENV_FILE "${RYLVA_STAGING_ENV_FILE}"
  Header always set X-Robots-Tag "noindex, nofollow, noarchive"
  Header always set X-Content-Type-Options "nosniff"
  ErrorLog ${APACHE_LOG_DIR}/rylva-staging-error.log
  <Directory "${RYLVA_PROJECT_ROOT}/public">
    Options +FollowSymLinks -Indexes -MultiViews
    AllowOverride FileInfo AuthConfig Options=Indexes,MultiViews,FollowSymLinks
    AuthType Basic
    AuthName "RylVa staging review"
    AuthBasicProvider file
    AuthUserFile "${RYLVA_STAGING_AUTH_FILE}"
    Require valid-user
    <FilesMatch "\.php$">
      SetHandler "proxy:unix:${RYLVA_FPM_SOCKET}|fcgi://localhost/"
    </FilesMatch>
  </Directory>
</VirtualHost>
